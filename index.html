<!DOCTYPE html>
<html lang="tr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pars Studio — Kartvizit</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b12;--t:#e8eef8;--m:#8b9bb4;--b:#5aa7ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,rgba(90,167,255,.2),transparent 42%),var(--bg);color:var(--t);font-family:"IBM Plex Sans",sans-serif}
.card{width:min(420px,100%);border-radius:28px;padding:28px 24px 22px;background:linear-gradient(165deg,#15233a 0%,#0d1524 55%,#12101f 100%);border:1px solid rgba(255,255,255,.1);box-shadow:0 30px 80px rgba(0,0,0,.45);text-align:center}
.av{width:86px;height:86px;border-radius:24px;margin:0 auto 14px;display:grid;place-items:center;background:linear-gradient(145deg,#1c4f8a,#0d2a4d);font-size:34px;font-weight:700}
h1{margin:0;font-size:24px} .role{color:var(--b);font-size:13px;margin:6px 0 12px;letter-spacing:.4px}
p{color:var(--m);font-size:14px;line-height:1.5}
.links{display:grid;gap:8px;margin:18px 0}
a{display:block;padding:11px 14px;border-radius:12px;text-decoration:none;color:var(--t);background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);font-weight:600;font-size:14px}
a:hover{border-color:#3a6aa0}
.row{display:flex;gap:8px}.row a{flex:1}
.foot{color:var(--m);font-size:11px}
</style></head>
<body>
<article class="card">
  <div class="av">P</div>
  <h1>Pars Studio</h1>
  <div class="role">Dijital araçlar &amp; web deneyimleri</div>
  <p>Tek sayfalık uygulamalar, finans panelleri ve sahne işleri. GitHub Pages üzerinde üretilir.</p>
  <div class="links">
    <a href="https://ermetasarim.github.io/projeler/">Portföy</a>
    <a href="https://github.com/ermetasarim">GitHub</a>
    <div class="row"><a href="https://ermetasarim.github.io/butce/">Ledger</a><a href="https://ermetasarim.github.io/doviz/">Piyasa</a></div>
    <a href="mailto:ermetasarim@gmail.com">ermetasarim@gmail.com</a>
  </div>
  <div class="foot">Kartı kaydet · paylaş · ana ekrana ekle</div>
</article>
</body></html>
